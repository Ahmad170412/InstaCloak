<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" role="img" aria-label="InstaCloak">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <linearGradient id="shield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="55%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Background pill -->
  <rect width="320" height="80" rx="14" fill="url(#bg)"/>

  <!-- Icon: stealth shield with an eye = cloaked observation -->
  <g transform="translate(16, 12)">
    <path d="M28 4 C40 12 50 13 50 13 L50 30 C50 42 40 50 28 56 C16 50 6 42 6 30 L6 13 C6 13 16 12 28 4 Z"
          fill="none" stroke="url(#shield)" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- eye -->
    <path d="M15 29 C19 23 23 20 28 20 C33 20 37 23 41 29 C37 35 33 38 28 38 C23 38 19 35 15 29 Z"
          fill="#0f172a" stroke="url(#shield)" stroke-width="1.8" stroke-linejoin="round"/>
    <circle cx="28" cy="29" r="5" fill="url(#shield)"/>
    <circle cx="28" cy="29" r="1.9" fill="#0f172a"/>
    <circle cx="30" cy="26.8" r="1" fill="#e0f2fe" opacity="0.9"/>
  </g>

  <!-- Project acronym -->
  <text x="80" y="36"
        font-family="'Segoe UI', system-ui, -apple-system, sans-serif"
        font-weight="700" font-size="22"
        fill="url(#accent)" letter-spacing="1">IC</text>

  <!-- Divider -->
  <line x1="80" y1="44" x2="308" y2="44" stroke="#334155" stroke-width="0.8"/>

  <!-- Project name -->
  <text x="80" y="58"
        font-family="'Segoe UI', system-ui, -apple-system, sans-serif"
        font-size="10.5" fill="#94a3b8" letter-spacing="0.5">InstaCloak</text>

  <!-- Chips -->
  <rect x="168" y="47" width="40" height="15" rx="7.5" fill="#1e3a5f"/>
  <text x="188" y="57.5"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="8" fill="#38bdf8" text-anchor="middle">Python</text>

  <rect x="212" y="47" width="32" height="15" rx="7.5" fill="#0c2340"/>
  <text x="228" y="57.5"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="8" fill="#818cf8" text-anchor="middle">CLI</text>

  <rect x="248" y="47" width="40" height="15" rx="7.5" fill="#134e4a"/>
  <text x="268" y="57.5"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="8" fill="#2dd4bf" text-anchor="middle">OSINT</text>
</svg>
