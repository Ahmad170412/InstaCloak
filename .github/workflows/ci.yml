name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11"]
        include:
          # Bleeding-edge interpreter on Linux only (cheap coverage)
          - os: ubuntu-latest
            python-version: "3.13"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Offline test suite
        run: python tests/test_instacloak.py

      - name: Entry-point smoke (no browser launch)
        run: |
          python main.py --version
          python -m instacloak --version
