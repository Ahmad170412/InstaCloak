[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "instacloak"
version = "1.0.0"
description = "Stealth Instagram OSINT through a humanized, visible browser"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cloakbrowser[geoip]~=0.5.10",
    "rich>=13.0",
]

[project.license]
file = "LICENSE"

[project.scripts]
instacloak = "instacloak.cli:main"

[tool.setuptools.packages.find]
include = ["instacloak*"]
